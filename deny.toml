# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/ (same policy as TeamCraft).

[graph]
# The gateway has no features of its own; optional features of dependencies (hpke-rs: libcrux) are not built.
all-features = false

[advisories]
# Every ignored advisory needs a reason and a link.
ignore = []

[licenses]
confidence-threshold = 0.93
allow = [
  "0BSD",
  "AGPL-3.0-only",
  "AGPL-3.0-or-later",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# One implementation per concern: rustls everywhere, no OpenSSL.
deny = [
  { name = "openssl" },
  { name = "openssl-sys" },
  { name = "native-tls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
