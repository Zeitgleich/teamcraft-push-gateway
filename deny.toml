# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/ (same policy as TeamCraft).

[graph]
# The gateway has no features of its own; optional features of dependencies (hpke-rs: libcrux) are not built.
all-features = false

[advisories]
# Every ignored advisory needs a reason and a link.
ignore = [
  # Unmaintained proc-macro error helpers, compile time only: hax-lib-macros, pulled in by libcrux-sha3,
  # which hpke-rs always depends on. No runtime code, no known vulnerability. Same entry as TeamCraft's.
  # https://rustsec.org/advisories/RUSTSEC-2026-0173
  { id = "RUSTSEC-2026-0173", reason = "unmaintained compile-time proc macro via hax-lib (hpke-rs)" },
  # Timing variability in crypto-bigint below 0.7.6, here 0.5 through elliptic-curve 0.13, which
  # hpke-rs-rust-crypto 0.7 depends on; there is no patched 0.5 release. Exploiting it needs a local
  # timing or microarchitectural side channel on the gateway host. Same entry as TeamCraft's; remove
  # with the hpke-rs upgrade.
  # https://rustsec.org/advisories/RUSTSEC-2026-0387
  { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 only via elliptic-curve 0.13 (hpke-rs-rust-crypto); no patched 0.5 release" },
]

[licenses]
confidence-threshold = 0.93
allow = [
  "0BSD",
  "AGPL-3.0-only",
  "AGPL-3.0-or-later",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# One implementation per concern: rustls everywhere, no OpenSSL.
deny = [
  { name = "openssl" },
  { name = "openssl-sys" },
  { name = "native-tls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
