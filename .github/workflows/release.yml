# Release: a tag `v*` equal to the version in Cargo.toml builds the container image (amd64 + arm64,
# each on a native runner), pushes it to ghcr.io/<owner>/teamcraft-push-gateway (version, X.Y and
# `latest` for releases; only the version for prereleases), signs it with cosign (keyless), attaches a
# build provenance attestation and SBOMs, and creates a **draft** GitHub release that a maintainer
# reviews and publishes by hand.
name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Every job states what it needs.
permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: teamcraft-push-gateway

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
      image_owner: ${{ steps.version.outputs.image_owner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # The tag (v1.2.3, or v1.2.3-rc.1 for a candidate) must fit the version in Cargo.toml.
      - name: Tag fits the version in the tree
        id: version
        env:
          TAG: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          version="${TAG#v}"
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          if [ "${version%%-*}" != "$cargo_version" ]; then
            echo "tag $TAG does not fit version $cargo_version in Cargo.toml" >&2
            exit 1
          fi
          grep -q "^## \[${version%%-*}\]" CHANGELOG.md || { echo "CHANGELOG.md has no section for ${version%%-*}" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in *-*) echo "is_prerelease=true" ;; *) echo "is_prerelease=false" ;; esac >> "$GITHUB_OUTPUT"
          echo "image_owner=${OWNER,,}" >> "$GITHUB_OUTPUT"

  image:
    name: Image (${{ matrix.platform }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ needs.version.outputs.image_owner }}/teamcraft-push-gateway
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
      # Pushed by digest only; the manifest job puts both architectures under the version tags.
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: containers/teamcraft-push-gateway.Containerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          provenance: mode=max
          sbom: true
      - name: Remember the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  image-manifest:
    name: Image (multi-arch tags, signature, attestation)
    needs: [version, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Keyless signing and the provenance attestation (OIDC token, attestation store).
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/${{ needs.version.outputs.image_owner }}/teamcraft-push-gateway
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # 1.2.3, 1.2 and latest for releases; a prerelease (1.0.0-rc.1) only gets its own tag.
      # Deployments should still pin a version or a digest (images.txt).
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ needs.version.outputs.is_prerelease == 'false' }}
      - name: Create the multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          tags=()
          while IFS= read -r tag; do [ -n "$tag" ] && tags+=(-t "$tag"); done <<< "$DOCKER_METADATA_OUTPUT_TAGS"
          sources=()
          for digest in *; do sources+=("${IMAGE}@sha256:${digest}"); done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
      - name: Record the manifest digest
        id: digest
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          digest="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest}}' | jq -r .digest)"
          mkdir -p out
          echo "${IMAGE}:${VERSION}@${digest}" > "out/images.txt"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # Keyless: the certificate names this workflow and the tag (cosign verify, release notes).
      - name: Sign the image
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
      - name: SBOM of the image (SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.IMAGE }}@${{ steps.digest.outputs.digest }}
          format: spdx-json
          output-file: out/teamcraft-push-gateway-${{ needs.version.outputs.version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: SBOM of the image (CycloneDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.IMAGE }}@${{ steps.digest.outputs.digest }}
          format: cyclonedx-json
          output-file: out/teamcraft-push-gateway-${{ needs.version.outputs.version }}.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-image
          path: out/*
          if-no-files-found: error

  release:
    name: Draft release
    needs: [version, image-manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      IS_PRERELEASE: ${{ needs.version.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-image
          path: dist
      - name: Source SBOM (SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: teamcraft-push-gateway-source-${{ needs.version.outputs.version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Checksums
        run: |
          mv "teamcraft-push-gateway-source-${VERSION}.spdx.json" dist/
          (cd dist && sha256sum -- * > SHA256SUMS)
          ls -l dist
      - name: Build provenance attestation of the files
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Release notes
        env:
          REPO: ${{ github.repository }}
        run: |
          image="$(cat dist/images.txt)"
          {
            sed -n "/^## \[${VERSION%%-*}\]/,/^## \[/p" CHANGELOG.md | sed '1d;$d'
            printf '\n## Verify\n\n```sh\n'
            printf 'cosign verify %s \\\n' "$image"
            printf "  --certificate-identity-regexp '^https://github.com/%s/\\\\.github/workflows/release\\\\.yml@refs/tags/v' \\\\\n" "$REPO"
            printf '  --certificate-oidc-issuer https://token.actions.githubusercontent.com\n'
            printf 'gh attestation verify oci://%s --repo %s\n```\n' "$image" "$REPO"
          } > notes.md
          cat notes.md
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=(--draft --verify-tag --title "TeamCraft push gateway ${VERSION}" --notes-file notes.md)
          [ "$IS_PRERELEASE" = true ] && flags+=(--prerelease)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" "${flags[@]}" dist/*
          fi
